services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Wexample\SymfonyMail\Service\MailSenderService:
        arguments:
            $layout: '%wexample_symfony_mail.layout%'
            $textLayout: '%wexample_symfony_mail.text_layout%'
            $appName: '%wexample_symfony_mail.app_name%'
            $defaultLocale: '%kernel.default_locale%'

    Wexample\SymfonyMail\Twig\:
        resource: '../../Twig'

    Wexample\SymfonyMail\Command\:
        resource: '../../Command'

    # Public: an application's functional tests read the mails from it.
    Wexample\SymfonyMail\Service\MailboxService:
        public: true
        arguments:
            $directory: '%wexample_symfony_mail.mailbox.directory%'

    # Without the dispatcher, the Twig listener never renders a TemplatedEmail
    # and the mailbox keeps a mail without a body.
    Wexample\SymfonyMail\Transport\MailboxTransportFactory:
        arguments:
            $environment: '%kernel.environment%'
            $dispatcher: '@event_dispatcher'
            $logger: '@?logger'
        tags: [mailer.transport_factory]
